[pytest]
python_files = test_*.py bench_*.py

# --strict-markers: an unregistered marker is a typo, and a typo'd marker
# silently selects nothing — which for `-m "not slow"` means silently running
# a test the fast gate meant to skip, or worse, silently skipping one it meant
# to run. Fail on it instead.
addopts = --strict-markers

markers =
    slow: takes more than ~5 s. Deselected by `gate/run_suite.py --fast`
        (the per-commit gate); always run by the full pre-merge gate. Mark a
        test slow because it INTEGRATES over time (a QP loop, a traversal),
        never to get a failing test out of the way.
